name: 작업 (Task)
description: 문서 작업 (ADR, 트러블슈팅, 기획서·브리프·디자인 시스템 수정, 컨벤션)
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: 상위 에픽
      description: 에픽의 하위 작업이면 번호. 없으면 비운다
      placeholder: "#12"
  - type: input
    id: refs
    attributes:
      label: 관련 문서·이슈·PR
      placeholder: "기획서 §7, ADR-001, worklearn-hrd/worklearn-api#34"
